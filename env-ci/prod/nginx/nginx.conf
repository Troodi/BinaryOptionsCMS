server {
    listen 443 ssl;
    ssl_certificate /var/certs/domain.crt;
    ssl_certificate_key /var/certs/domain.key;
    ssl_protocols TLSv1.2 TLSv1.1 TLSv1;

    server_name chart.binaries.website;

    location / {
      proxy_ssl_server_name on;
      proxy_pass https://prodata.tradingview.com/socket.io/websocket;
      proxy_http_version 1.1;
      proxy_set_header Origin https://www.tradingview.com;
      proxy_set_header Host prodata.tradingview.com;
      proxy_set_header Upgrade "websocket";
      proxy_set_header Connection "Upgrade";
      proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/85.0.4183.83 Safari/537.36";
      proxy_set_header Pragma "no-cache";
      proxy_buffering off;
    }
}

server {
    listen 8083 ssl;
    ssl_certificate /var/certs/domain.crt;
    ssl_certificate_key /var/certs/domain.key;
    ssl_protocols TLSv1.2 TLSv1.1 TLSv1;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

  	location /socket.io {
  		proxy_pass https://echoserver:6001;
  		proxy_http_version 1.1;
  		proxy_set_header Upgrade $http_upgrade;
  		proxy_set_header Connection "Upgrade";
  	}

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass binaries-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
